[tools]
go = "1.26.6"
goreleaser = "2.17.1"
actionlint = "1.7.12"
taplo = "0.10.0"
golangci-lint = "2.12.2"
typos = "1.48.0"
gitleaks = "8.30.1"
syft = "1.51.1"

[tasks.build]
description = "Build the public library and single CLI"
run = ["go build ./...", "go vet ./..."]

# Two ways to run the same suite.
#
# `test` is what a developer reads: `go test` renders progress and failures the
# way everyone already knows how to read.
#
# `test-audit` is what CI runs, and it answers a question `test` cannot. A
# non-verbose `go test` prints `ok` for a package whose every test was skipped,
# so a runner that lost `git` from PATH, or an environment variable that
# narrowed -test.run, could retire a whole package and leave the job green. The
# audit reads the machine-readable stream and refuses a run that produced no
# verdict, or a skip nobody recorded. It renders failures itself, because a
# -json stream is not readable and a task that hides the reason for a failure
# is a task nobody will run.
[tasks.test]
description = "Run unit, property, protocol, and toolchain-backed E2E tests"
run = "go test -timeout 40m ./..."

[tasks.test-audit]
description = "Run the suite and audit what actually ran: no silent package, no unrecorded skip"
run = """
mkdir -p .goatest
go test -json -timeout 40m ./... > .goatest/test-events.jsonl && status=0 || status=$?
go run ./internal/devtools/testaudit < .goatest/test-events.jsonl || status=1
exit $status
"""
run_windows = """
New-Item -ItemType Directory -Force -Path .goatest | Out-Null
go test -json -timeout 40m ./... > .goatest/test-events.jsonl
$status = $LASTEXITCODE
Get-Content .goatest/test-events.jsonl | go run ./internal/devtools/testaudit
if ($LASTEXITCODE -ne 0) { $status = 1 }
exit $status
"""

[tasks.test-race]
description = "Run the complete suite under Go's race detector"
run = "go test -race -timeout 40m ./..."

[tasks.fmt]
description = "Check Go and TOML formatting without rewriting files"
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }',
  "taplo fmt --check",
]
run_windows = [
  'pwsh -NoLogo -NoProfile -Command "$f = gofmt -l .; if ($f) { $f; exit 1 }"',
  "taplo fmt --check",
]

[tasks.check]
description = "Run every local release gate"
run = ["mise run fmt", "mise run build", "mise run test", "mise run lint"]

[tasks.lint]
description = "Run Go, workflow, spelling, and secret linters"
run = [
  "golangci-lint run",
  "actionlint",
  "typos",
  "gitleaks dir . --no-banner --redact",
]

[tasks.package]
description = "Build cross-platform snapshot archives"
run = "goreleaser release --snapshot --clean"

[tasks.dogfood]
description = "Run goatest against its own repository"
run = [
  "go build -o ./dist/dogfood/goatest ./cmd/goatest",
  "./dist/dogfood/goatest verify --ui=plain",
]
run_windows = [
  "go build -o ./dist/dogfood/goatest.exe ./cmd/goatest",
  '.\dist\dogfood\goatest.exe verify --ui=plain',
]

[tasks.trace-summary]
description = "Summarize a goatest-trace-v1 stream into the run's performance breakdown"
run = "go run ./internal/devtools/tracesummary"

[tasks.report-diff]
description = "Compare two assurance reports: verdict, accounting, mutant transitions, and lost kills"
run = "go run ./internal/devtools/reportdiff"

[tasks.proof-audit]
description = "Audit the proof layers of a recorded run: does a layer drop a target that killed a mutant?"
run = "go run ./internal/devtools/proofaudit"
