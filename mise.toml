[tools]
go = "1.26.6"
goreleaser = "2.17.1"
actionlint = "1.7.12"
taplo = "0.10.0"
golangci-lint = "2.12.2"
typos = "1.48.0"
gitleaks = "8.30.1"
syft = "1.51.1"

[tasks.build]
description = "Build the public library and single CLI"
run = ["go build ./...", "go vet ./..."]

[tasks.test]
description = "Run unit, property, protocol, and toolchain-backed E2E tests"
run = "go test -timeout 40m ./..."

[tasks.test-race]
description = "Run the complete suite under Go's race detector"
run = "go test -race -timeout 40m ./..."

[tasks.fmt]
description = "Check Go and TOML formatting without rewriting files"
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }',
  "taplo fmt --check",
]
run_windows = [
  'pwsh -NoLogo -NoProfile -Command "$f = gofmt -l .; if ($f) { $f; exit 1 }"',
  "taplo fmt --check",
]

[tasks.check]
description = "Run every local release gate"
run = ["mise run fmt", "mise run build", "mise run test", "mise run lint"]

[tasks.lint]
description = "Run Go, workflow, spelling, and secret linters"
run = [
  "golangci-lint run",
  "actionlint",
  "typos",
  "gitleaks dir . --no-banner --redact",
]

[tasks.package]
description = "Build cross-platform snapshot archives"
run = "goreleaser release --snapshot --clean"

[tasks.dogfood]
description = "Run goatest against its own repository"
run = [
  "go build -o ./dist/dogfood/goatest ./cmd/goatest",
  "./dist/dogfood/goatest verify --ui=plain",
]
run_windows = [
  "go build -o ./dist/dogfood/goatest.exe ./cmd/goatest",
  '.\dist\dogfood\goatest.exe verify --ui=plain',
]

[tasks.trace-summary]
description = "Summarize a goatest-trace-v1 stream into the run's performance breakdown"
run = "go run ./internal/devtools/tracesummary"
