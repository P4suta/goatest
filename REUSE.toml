  "docs/adr/0008-controls-before-timeouts.md",
  "docs/adr/0009-parallel-measurement-serial-commit.md",
  "docs/adr/0010-whole-suite-reach-before-fallback.md",
  "docs/adr/0011-append-only-checkpoint-journal.md",
  "docs/adr/0012-aggregate-proof-before-timeout.md",
  "docs/adr/0013-preserve-block-routing-across-resume.md",
  "docs/adr/0014-resume-complete-probe-phase.md",
  "docs/adr/0015-execute-framed-baselines-directly.md",
