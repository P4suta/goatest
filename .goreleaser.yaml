version: 2
project_name: goatest

builds:
  - id: goatest
    main: ./cmd/goatest
    binary: goatest
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      # The stamped version keeps the v prefix every other build shape carries
      # (the v0.1.0-dev default, git tags), because this string participates in
      # evidence identity and must not fork between build shapes.
      - >-
        -s -w
        -X github.com/P4suta/goatest/internal/assure.GoatestVersion=v{{ .Version }}

archives:
  - id: goatest
    ids: [goatest]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files: [LICENSE-MIT, LICENSE-APACHE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "^build:"]

release:
  github:
    owner: P4suta
    name: goatest
  mode: keep-existing
