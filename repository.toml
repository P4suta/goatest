name = "goatest"
summary = "A scope-aware assurance runner for Go tests, fuzzing, mutation testing, and durable reports"
install = """
git clone https://github.com/P4suta/goatest.git
cd goatest
mise install go
mise x -- go install ./cmd/goatest
"""
usage = "mise x -- go mod download all\ngoatest init\ngoatest plan ./..."
usage_language = "sh"
documentation_index = true
copyright = "2026 goatest contributors"
license = "MIT OR Apache-2.0"

