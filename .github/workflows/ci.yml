name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go 1.26 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The whole history, so that a run asking what changed can be told.
          # A shallow clone answers "nothing changed" to every question about a
          # range it does not hold, which is the same answer as a clean tree and
          # a completely different fact.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Download pinned modules
        run: go mod download
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tier offline
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTELEMETRY: "off"
          GOTOOLCHAIN: "local"
          GOATEST_TEST_REQUIRE_TOOLS: "1"
        shell: bash
        run: |
          mkdir -p .goatest
          go test -json -timeout 40m ./... > .goatest/test-events.jsonl && audit_exit=0 || audit_exit=$?
          go run ./internal/devtools/testaudit < .goatest/test-events.jsonl || audit_exit=1
          exit "$audit_exit"
      - name: Integration tier offline
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTELEMETRY: "off"
          GOTOOLCHAIN: "local"
          GOATEST_TEST_REQUIRE_TOOLS: "1"
        shell: bash
        run: |
          mkdir -p .goatest
          go test -json -tags integration -timeout 40m ./... > .goatest/integration-events.jsonl && audit_exit=0 || audit_exit=$?
          go run ./internal/devtools/testaudit < .goatest/integration-events.jsonl || audit_exit=1
          exit "$audit_exit"

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The whole history, so that a run asking what changed can be told.
          # A shallow clone answers "nothing changed" to every question about a
          # range it does not hold, which is the same answer as a clean tree and
          # a completely different fact.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Race detector
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTELEMETRY: "off"
          GOTOOLCHAIN: "local"
          GOATEST_TEST_REQUIRE_TOOLS: "1"
        run: go test -race -tags integration -timeout 40m ./...

  # goatest verifying goatest.
  #
  # The task existed and nothing ran it. Every other check here asks whether the
  # code is what this repository says it is; this one asks whether the tool does
  # what it says it does, which is the only question the tool itself can answer.
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Verify what this branch changed, with itself
        env:
          GOATEST_TRACE: "1"
        run: mise run dogfood-changed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dogfood-reports
          if-no-files-found: ignore
          path: |
            reports/
            .goatest/trace/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The whole history, so that a run asking what changed can be told.
          # A shallow clone answers "nothing changed" to every question about a
          # range it does not hold, which is the same answer as a clean tree and
          # a completely different fact.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.8.14
          install_args: go golangci-lint actionlint typos gitleaks taplo
      - name: Lint
        env:
          GOTELEMETRY: "off"
          GOTOOLCHAIN: "local"
        run: mise run lint
      - name: TOML formatting
        run: taplo fmt --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
          cache: false
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
