name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go 1.27.3 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - name: Download pinned modules
        run: go mod download
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test offline
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTELEMETRY: "off"
          GOTOOLCHAIN: "local"
        run: go test -timeout 40m ./...

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.17
          install_args: go golangci-lint actionlint typos gitleaks taplo
      - name: Lint
        env:
          GOTELEMETRY: "off"
          GOTOOLCHAIN: "local"
        run: mise run lint
      - name: TOML formatting
        run: taplo fmt --check

  required:
    name: required
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
