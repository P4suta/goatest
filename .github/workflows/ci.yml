name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go 1.26 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Download pinned modules
        run: go mod download
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test offline
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTELEMETRY: "off"
          GOTOOLCHAIN: "local"
        run: go test -timeout 40m ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Race detector
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTELEMETRY: "off"
          GOTOOLCHAIN: "local"
        run: go test -race -timeout 40m ./...

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
